<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Hangman Web</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; text-align: center; padding: 40px; }
        #word-display { font-size: 2.5rem; letter-spacing: 10px; margin: 20px 0; font-family: monospace; }
        #keyboard { display: flex; flex-wrap: wrap; max-width: 600px; margin: 20px auto; justify-content: center; gap: 8px; }
        button { width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; border-radius: 5px; border: none; background: #333; color: white; }
        button:disabled { background: #555; opacity: 0.4; cursor: not-allowed; }
        #status { font-size: 1.2rem; color: #ffab00; height: 30px; }
    </style>
</head>
<body>

    <h1>Hangman Game</h1>
    <div id="word-display">_ _ _ _</div>
    <div id="status">Lives Remaining: 6</div>
    <div id="keyboard"></div>

    <script type="py">
import random
from pyscript import document
from pyodide.ffi import create_proxy

word_bank = ["python", "snake", "matter", "profession", "assistant", "technical"]
secret_word = random.choice(word_bank)
GL = []
lives = 6

def update_display():
    display = ""
    for char in secret_word:
        if char in GL:
            display += char + " "
        else:
            display += "_ "
    document.querySelector("#word-display").innerText = display
    
    if "_" not in display:
        document.querySelector("#status").innerText = "YOU WON!!!! 🎉"
        disable_all_buttons()
    elif lives <= 0:
        document.querySelector("#status").innerText = f"YOU LOSE! The word was: {secret_word}"
        disable_all_buttons()

def disable_all_buttons():
    for btn in document.querySelectorAll("#keyboard button"):
        btn.disabled = True

def make_guess(event):
    global lives
    btn = event.target
    letter = btn.innerText.lower()
    btn.disabled = True
    
    GL.append(letter)
    if letter not in secret_word:
        lives -= 1
        
    document.querySelector("#status").innerText = f"Lives Remaining: {lives}"
    update_display()

# Build On-Screen Keyboard
keyboard = document.querySelector("#keyboard")
for char in "abcdefghijklmnopqrstuvwxyz":
    btn = document.createElement("button")
    btn.innerText = char.upper()
    btn.onclick = create_proxy(make_guess)
    keyboard.appendChild(btn)

update_display()
    </script>
</body>
</html>
